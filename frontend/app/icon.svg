<svg width="100" height="100" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="gold-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F59E0B;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#D97706;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#B45309;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- King Piece Stylized - No Background -->
  <g>
    <!-- Base -->
    <rect x="25" y="80" width="50" height="8" rx="2" fill="url(#gold-grad)" />
    <rect x="30" y="72" width="40" height="6" rx="1" fill="url(#gold-grad)" opacity="0.8" />
    
    <!-- Body/Neck -->
    <path d="M35 72 L42 35 L58 35 L65 72 Z" fill="url(#gold-grad)" />
    
    <!-- Crown/Head -->
