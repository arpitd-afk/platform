    <rect x="47" y="32" width="6" height="10" rx="1" fill="#111827" opacity="0.2" />
    
    <!-- Cross on top -->
    <rect x="48" y="10" width="4" height="12" rx="1" fill="url(#gold-grad)" />
    <rect x="44" y="14" width="12" height="4" rx="1" fill="url(#gold-grad)" />
    
    <!-- Detail pattern -->
    <path d="M45 50 L50 45 L55 50 L50 55 Z" fill="#111827" opacity="0.3" />
